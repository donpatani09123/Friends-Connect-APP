<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vibzz | Real voices. Real connections.</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #14171c;
      --cd: #1b1f26;
      --ln: #2a2f39;
      --tx: #eceef2;
      --mu: #8d95a3;
      --ac: #8b5cf6;
      --dn: #ff6b6b;
      --ok: #10b981;
      color-scheme: dark;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); color: var(--tx); }
    body { margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.5 Inter, system-ui, -apple-system, sans-serif; min-height: 100vh; }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: inherit; text-decoration: none; }
    .btn { background: var(--ac); border: 0; border-radius: 12px; padding: 10px 18px; cursor: pointer; font-weight: 600; transition: .2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .btn.g { background: transparent; border: 1px solid var(--ln); }
    .btn.g:hover { border-color: var(--ac); }
    .btn.d { background: transparent; border: 1px solid var(--dn); color: var(--dn); }
    .btn.d:hover { background: rgba(255, 107, 107, 0.1); }
    .btn.ok { background: var(--ok); color: #fff; }
    .btn.ok:hover { filter: brightness(1.15); }
    .btn.s { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
    .in { width: 100%; background: var(--bg); border: 1px solid var(--ln); border-radius: 12px; padding: 10px 12px; outline: 0; transition: .2s; color: var(--tx); }
    .in:focus { border-color: var(--ac); }
    .cd { background: var(--cd); border: 1px solid var(--ln); border-radius: 18px; padding: 18px; transition: .2s; }
    .mu { color: var(--mu); }
    .row { display: flex; gap: 10px; align-items: center; }
    .sp { justify-content: space-between; }
    .w { flex-wrap: wrap; }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
    h1, h2, h3 { margin: 0 0 8px; line-height: 1.2; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; letter-spacing: -.5px; cursor: pointer; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 20px; }
    .hero { text-align: center; padding: 70px 0 40px; }
    .hero h1 { font-size: clamp(32px, 6vw, 56px); }
    .hero h1 em { color: var(--ac); font-style: normal; }
    .auth { max-width: 400px; margin: 40px auto; }
    .auth .cd { display: grid; gap: 12px; }
    .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    .side { border-right: 1px solid var(--ln); padding: 20px 14px; position: sticky; top: 0; height: 100vh; background: var(--bg); display: flex; flex-direction: column; }
    .side a { display: block; padding: 10px 14px; border-radius: 12px; color: var(--mu); margin-bottom: 4px; transition: .2s; font-weight: 500; }
    .side a:hover { color: var(--tx); background: rgba(255, 255, 255, 0.03); }
    .side a.on { background: var(--cd); color: var(--tx); box-shadow: inset 3px 0 var(--ac); font-weight: 600; }
    .top { display: flex; gap: 12px; align-items: center; padding: 14px 22px; border-bottom: 1px solid var(--ln); position: sticky; top: 0; background: var(--bg); z-index: 10; }
    .main { padding: 22px; min-width: 0; }
    .pill { border: 1px solid var(--ln); border-radius: 99px; padding: 4px 12px; font-size: 13px; color: var(--mu); display: inline-flex; align-items: center; gap: 6px; }
    .pill.ac { border-color: var(--ac); color: var(--ac); background: rgba(139, 92, 246, 0.1); }
    .pill.ok { border-color: var(--ok); color: var(--ok); background: rgba(16, 185, 129, 0.12); }
    .dd { position: relative; }
    .dd .menu { display: none; position: absolute; right: 0; top: 44px; background: var(--cd); border: 1px solid var(--ln); border-radius: 14px; padding: 6px; min-width: 170px; z-index: 20; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    .dd.open .menu { display: block; }
    .menu button { display: block; width: 100%; text-align: left; background: 0; border: 0; padding: 9px 12px; border-radius: 10px; cursor: pointer; color: var(--tx); transition: .15s; }
    .menu button:hover { background: var(--bg); }
    .mod { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; animation: f .2s ease-out; }
    .mod > .cd { max-width: 440px; width: 100%; max-height: 90vh; overflow: auto; display: grid; gap: 12px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); }
    @keyframes f { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
    .radar { width: 220px; height: 220px; margin: 16px auto; position: relative; display: grid; place-items: center; }
    .radar i { position: absolute; inset: 0; border: 2px solid var(--ac); border-radius: 50%; opacity: 0; }
    .radar.on i { animation: p 2.4s infinite; }
    .radar.on i:nth-child(2) { animation-delay: .8s; }
    .radar.on i:nth-child(3) { animation-delay: 1.6s; }
    @keyframes p { 0% { transform: scale(.3); opacity: .9; } 100% { transform: scale(1); opacity: 0; } }
    .dot { width: 72px; height: 72px; border-radius: 50%; background: var(--ac); display: grid; place-items: center; font-size: 26px; box-shadow: 0 0 30px rgba(139, 92, 246, 0.5); }
    .viz { display: flex; gap: 5px; height: 60px; align-items: center; justify-content: center; }
    .viz b { width: 6px; border-radius: 4px; background: var(--ac); animation: v 1s infinite ease-in-out; height: 18px; }
    @keyframes v { 50% { height: 56px; } }
    .call { position: fixed; inset: 0; background: var(--bg); z-index: 60; display: grid; place-content: center; text-align: center; gap: 16px; padding: 20px; }
    .big { font-size: 28px; font-weight: 700; }
    .media { height: 170px; border-radius: 14px; background: linear-gradient(135deg, #242a35, #1b1f26); display: grid; place-items: center; color: var(--mu); margin-bottom: 10px; font-weight: 600; letter-spacing: .5px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--ln); font-size: 14px; }
    th { color: var(--mu); font-weight: 500; }
    .bars { display: flex; gap: 10px; align-items: flex-end; height: 150px; padding-top: 10px; }
    .bars div { flex: 1; background: var(--ac); border-radius: 8px 8px 0 0; opacity: .85; transition: .3s; }
    .bars div:hover { opacity: 1; filter: brightness(1.2); }
    .otp { letter-spacing: 14px; text-align: center; font-size: 24px; font-weight: 700; }
    .scan { height: 150px; border: 1px dashed var(--ac); border-radius: 14px; position: relative; overflow: hidden; background: rgba(139, 92, 246, 0.05); }
    .scan:after { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: var(--ac); box-shadow: 0 0 10px var(--ac); animation: sc 2s infinite alternate linear; }
    @keyframes sc { from { top: 0; } to { top: 100%; } }
    .desk { display: grid; grid-template-columns: 260px 1fr 280px; gap: 14px; height: calc(100vh - 130px); min-height: 480px; }
    .desk > .cd { overflow: auto; padding: 14px; }
    .tk { padding: 10px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; margin-bottom: 6px; transition: .15s; }
    .tk:hover, .tk.on { border-color: var(--ac); background: rgba(139, 92, 246, 0.08); }
    .msg { max-width: 80%; padding: 8px 14px; border-radius: 14px; background: var(--cd); border: 1px solid var(--ln); margin: 6px 0; }
    .msg.me { margin-left: auto; background: var(--ac); border-color: var(--ac); color: #fff; }
    .tg { width: 46px; height: 26px; border-radius: 99px; background: var(--ln); position: relative; cursor: pointer; border: 0; transition: .2s; }
    .tg:after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: .2s; }
    .tg.on { background: var(--ac); }
    .tg.on:after { left: 23px; }
    #toast { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); background: var(--cd); border: 1px solid var(--ac); padding: 10px 18px; border-radius: 12px; z-index: 99; display: none; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); font-weight: 500; }
    .sel { border: 1px solid var(--ln); border-radius: 12px; padding: 12px; cursor: pointer; transition: .2s; }
    .sel:hover { border-color: rgba(139, 92, 246, 0.4); }
    .sel.on { border-color: var(--ac); background: rgba(139, 92, 246, 0.1); }
    .vid-box { position: relative; width: 100%; max-width: 540px; height: 320px; border-radius: 18px; background: linear-gradient(135deg, #1b1f26, #0e1217); border: 1px solid rgba(139, 92, 246, 0.4); overflow: hidden; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    .vid-pip { position: absolute; bottom: 12px; right: 12px; width: 130px; height: 95px; border-radius: 12px; border: 2px solid var(--ac); background: #242a35; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.6); z-index: 10; }
    .vid-pip video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); background: #14171c; }
    .pulse-ring { animation: pulse 1.6s infinite ease-in-out; }
    @keyframes pulse { 0% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7); } 70% { transform: scale(1.02); box-shadow: 0 0 0 18px rgba(139, 92, 246, 0); } 100% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); } }
    @media(max-width: 800px) {
      .shell { grid-template-columns: 1fr; }
      .side { position: fixed; bottom: 0; left: 0; right: 0; top: auto; height: auto; z-index: 20; display: flex; flex-direction: row; gap: 4px; border: 0; border-top: 1px solid var(--ln); background: var(--bg); padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
      .side a { flex: 1; text-align: center; margin: 0; padding: 8px 4px; font-size: 13px; }
      .side .lg { display: none; }
      .main { padding: 16px 16px 90px; }
      .desk { grid-template-columns: 1fr; height: auto; }
      .top .sr { display: none; }
      .vid-box { height: 260px; }
      .vid-pip { width: 105px; height: 80px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="modal"></div>
  <div id="incoming-call-layer"></div>
  <div id="toast"></div>

  <script>
    const $ = s => document.querySelector(s), mem = {};
    const LOGO = '<span class="brand" onclick="location.hash=\'home\'"><svg width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Vibzz logo"><rect width="32" height="32" rx="9" fill="#8b5cf6"/><rect x="6" y="11" width="3.6" height="10" rx="1.8" fill="#fff"/><rect x="11.5" y="6" width="3.6" height="20" rx="1.8" fill="#fff"/><rect x="17" y="9" width="3.6" height="14" rx="1.8" fill="#fff"/><rect x="22.5" y="12" width="3.6" height="8" rx="1.8" fill="#fff"/></svg>Vibzz</span>';
    const SEED = {
      '9111111111': { r: 'user', n: 'Anita Joseph' },
      '9222222222': { r: 'org', n: 'Marine Drive Events' },
      '9333333333': { r: 'celebrity', n: 'Riya Menon' },
      '9000000001': { r: 'support', n: 'Support Agent' },
      '9000000002': { r: 'admin', n: 'Admin' }
    };

    const DB = {
      getSession() {
        try {
          const ss = sessionStorage.getItem('vibzz_session');
          if (ss) return JSON.parse(ss);
        } catch (e) {}
        try {
          const ls = localStorage.getItem('huddle');
          if (ls) return JSON.parse(ls).s;
        } catch (e) {}
        return mem.s || null;
      },
      setSession(s) {
        mem.s = s;
        try {
          if (s) sessionStorage.setItem('vibzz_session', JSON.stringify(s));
          else sessionStorage.removeItem('vibzz_session');
        } catch (e) {}
        try {
          const raw = JSON.parse(localStorage.getItem('huddle') || 'null') || { reg: SEED };
          raw.s = s;
          localStorage.setItem('huddle', JSON.stringify(raw));
        } catch (e) {}
      },
      get() {
        let d;
        try {
          d = JSON.parse(localStorage.getItem('huddle') || 'null') || { s: null, reg: SEED };
        } catch (e) {
          d = mem.d || { s: null, reg: SEED };
        }
        d.s = this.getSession();
        return d;
      },
      set(d) {
        mem.d = d;
        if (d && 's' in d) {
          this.setSession(d.s);
        }
        try { localStorage.setItem('huddle', JSON.stringify(d)); } catch (e) {}
      }
    };

    /* REAL-TIME AUDIO SYNTHESIZER (Ringtone for calls) */
    const SoundFX = {
      ctx: null,
      ringInterval: null,
      init() {
        if (!this.ctx) {
          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          } catch (e) {}
        }
      },
      startRinging() {
        this.init();
        this.stopRinging();
        if (!this.ctx) return;
        const playTone = () => {
          try {
            if (this.ctx.state === 'suspended') this.ctx.resume();
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, now); // A4 standard ring
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 1.2);
          } catch (e) {}
        };
        playTone();
        this.ringInterval = setInterval(playTone, 2800);
      },
      stopRinging() {
        if (this.ringInterval) {
          clearInterval(this.ringInterval);
          this.ringInterval = null;
        }
      }
    };

    /* VIP CALL BROKER (Instant sync between caller and celebrity) */
    const CALL_CHANNEL = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('vibzz_vip_hub') : null;

    const CallBroker = {
      getPendingCall() {
        try {
          const call = JSON.parse(localStorage.getItem('vibzz_pending_call') || 'null');
          if (call && call.status === 'ringing' && (Date.now() - call.timestamp > 50000)) {
            this.clearPendingCall();
            return null;
          }
          return call;
        } catch (e) {
          return null;
        }
      },
      setPendingCall(call) {
        try {
          if (call) {
            localStorage.setItem('vibzz_pending_call', JSON.stringify(call));
          } else {
            localStorage.removeItem('vibzz_pending_call');
          }
          localStorage.setItem('vibzz_sync_time', String(Date.now()));
        } catch (e) {}
        CALL_CHANNEL?.postMessage({ type: 'CALL_UPDATE', call });
      },
      clearPendingCall() {
        this.setPendingCall(null);
      },
      saveCustomCreator(creator) {
        try {
          let list = JSON.parse(localStorage.getItem('vibzz_custom_creators') || '[]');
          if (!Array.isArray(list)) list = [];
          const idx = list.findIndex(c => (c.name && creator.name && c.name.toLowerCase() === creator.name.toLowerCase()) || (creator.phone && c.phone === creator.phone));
          if (idx >= 0) {
            list[idx] = { ...list[idx], ...creator };
          } else {
            list.push(creator);
          }
          localStorage.setItem('vibzz_custom_creators', JSON.stringify(list));
          localStorage.setItem('vibzz_sync_time', String(Date.now()));
        } catch (e) {}
        CALL_CHANNEL?.postMessage({ type: 'CREATOR_UPDATED', creator });
      },
      startCall(caller, celebName, mode, rate, celebPhone) {
        const call = {
          id: 'call_' + Date.now(),
          callerName: caller.name || 'Anita Joseph',
          callerPhone: caller.phone || '9111111111',
          celebName: celebName,
          celebPhone: celebPhone || '',
          mode: mode, // 'Voice' | 'Video'
          rate: rate || 150,
          status: 'ringing', // 'ringing' | 'accepted' | 'declined' | 'cancelled'
          timestamp: Date.now()
        };
        this.setPendingCall(call);
        this.signalViaPeer(call);
        return call;
      },
      signalViaPeer(call) {
        if (typeof peerInstance === 'undefined' || !peerInstance || peerInstance.destroyed) return;
        const targetIds = [];
        if (call.celebPhone) targetIds.push(getCleanPeerId('vibzz_u', call.celebPhone));
        if (call.celebName) targetIds.push(getCleanPeerId('vibzz_u', call.celebName));
        targetIds.forEach(targetId => {
          try {
            const conn = peerInstance.connect(targetId, { reliable: true });
            conn.on('open', () => {
              conn.send({ type: 'INCOMING_CALL', call });
            });
          } catch (e) {}
        });
      },
      acceptCall(callId) {
        const call = this.getPendingCall();
        if (call && call.id === callId) {
          call.status = 'accepted';
          this.setPendingCall(call);
          if (typeof peerInstance !== 'undefined' && peerInstance && !peerInstance.destroyed) {
            try {
              const callerId = getCleanPeerId('vibzz_u', call.callerPhone || call.callerName);
              const conn = peerInstance.connect(callerId, { reliable: true });
              conn.on('open', () => conn.send({ type: 'CALL_ANSWERED', callId }));
            } catch (e) {}
          }
          return call;
        }
        return null;
      },
      declineCall(callId) {
        const call = this.getPendingCall();
        if (call && call.id === callId) {
          call.status = 'declined';
          this.setPendingCall(call);
          if (typeof peerInstance !== 'undefined' && peerInstance && !peerInstance.destroyed) {
            try {
              const callerId = getCleanPeerId('vibzz_u', call.callerPhone || call.callerName);
              const conn = peerInstance.connect(callerId, { reliable: true });
              conn.on('open', () => conn.send({ type: 'CALL_DECLINED', callId }));
            } catch (e) {}
          }
          setTimeout(() => this.clearPendingCall(), 3000);
          return call;
        }
        return null;
      }
    };

    let peerInstance = null;
    function getCleanPeerId(prefix, str) {
      return (prefix + '_' + (str || '').replace(/[^a-zA-Z0-9]/g, '_')).toLowerCase();
    }

    function initPeerForSession(s) {
      if (typeof Peer === 'undefined' || !s) return;
      if (peerInstance && !peerInstance.destroyed) {
        if (peerInstance._userPhone === s.phone) return;
        try { peerInstance.destroy(); } catch (e) {}
      }

      const myPeerId = getCleanPeerId('vibzz_u', s.phone || s.name);
      try {
        peerInstance = new Peer(myPeerId, { debug: 0 });
        peerInstance._userPhone = s.phone;
        peerInstance.on('connection', conn => {
          conn.on('data', data => {
            if (data && data.type === 'INCOMING_CALL') {
              CallBroker.setPendingCall(data.call);
              checkIncomingCallForCelebrity();
              if (location.hash.includes('celebrity-queue')) route();
            } else if (data && data.type === 'CALL_ANSWERED') {
              CallBroker.acceptCall(data.callId);
            } else if (data && data.type === 'CALL_DECLINED') {
              CallBroker.declineCall(data.callId);
            }
          });
        });
      } catch (e) {}
    }

    const PFX = { user: 'app', org: 'org', celebrity: 'celebrity', support: 'support', admin: 'admin' };
    const NAV = {
      user: [['match', 'Voice & Video Match'], ['events', 'Events'], ['vip', 'Celebrities']],
      org: [['dash', 'Dashboard'], ['studio', 'Event Studio'], ['attendees', 'Attendees']],
      celebrity: [['studio', 'Creator Studio'], ['queue', 'Call Queue']],
      support: [['desk', 'Help Desk']],
      admin: [['overview', 'Overview'], ['users', 'Users'], ['approvals', 'Approvals']]
    };
    const home = r => PFX[r] + '-' + NAV[r][0][0];
    const PUB = ['home', 'login', 'signup', 'staff'];
    let pend = {}, ui = { tier: 0, seats: 1, tk: 0, q: '', f: 'all', online: true, mode: 'Video', camOff: false };
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    // Hardware camera media stream
    let localStream = null;
    let currentFacingMode = 'user';

    async function startCamera() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          toast('Camera not supported by browser');
          const p = $('#pipStatus');
          if (p) p.innerHTML = '<span style="color:var(--dn);font-size:10px">Not supported</span>';
          return null;
        }

        // Try getting both video and audio
        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: true
          });
        } catch (errAudio) {
          // Fallback to video only if microphone is busy or not plugged in
          localStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
          });
        }

        const vid = document.getElementById('selfieVid');
        if (vid && localStream) {
          vid.srcObject = localStream;
          await vid.play().catch(e => console.warn('Autoplay handled', e));
        }

        const pipStatus = document.getElementById('pipStatus');
        if (pipStatus) pipStatus.style.display = 'none';

        toast('Live Camera Active 🎥');
        return localStream;
      } catch (err) {
        console.error('Camera access error:', err);
        const pipStatus = document.getElementById('pipStatus');
        if (pipStatus) {
          pipStatus.innerHTML = '<div style="color:var(--dn);font-size:10px;line-height:1.2;padding:4px">Camera blocked<br><span style="color:#cbd5e1;font-size:9px">Click 🔒 in address bar to Allow</span></div>';
        }
        toast('Please allow camera permission in Chrome');
        return null;
      }
    }

    function stopCamera() {
      if (localStream) {
        localStream.getTracks().forEach(track => {
          try { track.stop(); } catch (e) {}
        });
        localStream = null;
      }
    }

    function toast(t) {
      const e = $('#toast');
      e.textContent = t;
      e.style.display = 'block';
      clearTimeout(toast.t);
      toast.t = setTimeout(() => e.style.display = 'none', 2600);
    }

    function modal(h) {

      const c = document.createElement('div');
      c.className = 'call';

      c.innerHTML = `

        </div>

        <div class="row" style="justify-content:center;gap:12px;margin-top:6px">
          <button class="btn d" data-a="cancelcall" data-id="${call.id}">Cancel Call</button>
        </div>`;
      document.body.appendChild(c);

      function handleCallEndOrDecline(status) {
        if (!currentOutgoingCall) return;
        clearInterval(callPollTimer);
        SoundFX.stopRinging();
        const celebName = currentOutgoingCall.celebName;
        const callMode = currentOutgoingCall.mode;
        currentOutgoingCall = null;
        $('#outgoingCallScreen')?.remove();

        if (status === 'accepted') {
          toast(`${celebName} accepted the call! Connecting 🎉`);
          callUI(celebName, callMode);
        } else if (status === 'declined') {
          toast(`${celebName} declined the call`);
        } else if (status === 'cancelled') {
          toast('Call cancelled');
        } else if (status === 'missed') {
          toast(`No answer from ${celebName}. Call missed.`);
        }
      }

      // Fast poll every 250ms
      clearInterval(callPollTimer);
      callPollTimer = setInterval(() => {
        const cur = CallBroker.getPendingCall();
        if (!cur || cur.status === 'cancelled') {
          handleCallEndOrDecline('cancelled');
          return;
        }

        if (cur.status === 'accepted') {
          handleCallEndOrDecline('accepted');
        } else if (cur.status === 'declined') {
          handleCallEndOrDecline('declined');
        }
      }, 250);

      // 30s ringing timeout
      setTimeout(() => {
        if (currentOutgoingCall && currentOutgoingCall.id === call.id) {
          CallBroker.clearPendingCall();
          handleCallEndOrDecline('missed');
        }
      }, 30000);
    }

          CallBroker.acceptCall(pending.id);
        } else {
          // If direct queue accept without prior ringing, create and accept one so both sides sync
          const s = DB.get().s;
          const directCall = {
            id: 'call_' + Date.now(),
            callerName: name,
            callerPhone: '9111111111',
            celebName: s?.name || 'Riya Menon',
            celebPhone: s?.phone || '9333333333',
            mode: mode,
            rate: 150,
            status: 'accepted',
            timestamp: Date.now()
          };
          CallBroker.setPendingCall(directCall);
          CALL_CHANNEL?.postMessage({ type: 'CALL_ANSWERED', callId: directCall.id, call: directCall });
        }

        SoundFX.stopRinging();
        $('#incoming-call-layer').innerHTML = '';
        toast(`Connecting VIP ${mode} Call with ${name}… 🎥`);
        await callUI(name, mode);
      },

      declinecall: t => {
        const name = t.dataset.n || 'Anita Joseph';
        const pending = CallBroker.getPendingCall();
        if (pending) {
          CallBroker.declineCall(pending.id);
        } else {
          CALL_CHANNEL?.postMessage({ type: 'CALL_DECLINED', callerName: name, celebName: DB.get().s?.name || 'Creator' });
        }
        SoundFX.stopRinging();
        $('#incoming-call-layer').innerHTML = '';
        t.closest('.cd')?.remove();
        toast(`Call from ${name} declined`);
      },

      premmodal: () => {
        $('#dd')?.classList.remove('open');
        modal(`<h3>⭐ Upgrade to Premium</h3><p class="mu" style="margin:0">Upgrade to Vibzz VIP Premium to unlock direct 1-on-1 audio and video calls with verified creators.</p><button class="btn" data-a="prem">Upgrade — ₹299/month</button><button class="btn g" data-a="close">Not now</button>`);
      },
      prem: () => {
        const d = DB.get();
        d.s.premium = true;
        DB.set(d);
        modal('');
        route();
        toast('Welcome to Vibzz Premium! ⭐');
      },
      avail: () => {
        ui.online = !ui.online;
        route();
        toast(ui.online ? 'Set status to Available' : 'Set status to Busy');
      },
      tk: t => {
        ui.tk = +t.dataset.i;
        route();
      },
      send: () => {
        const i = $('#ci');
        if (!i.value.trim()) return;
        $('#chat').insertAdjacentHTML('beforeend', `<div class="msg me">${esc(i.value)}</div>`);
        i.value = '';
      },
      ban: t => modal(`<h3>Ban ${t.dataset.n}?</h3><p class="mu" style="margin:0">This blocks the user from signing in and revokes their active session.</p><button class="btn d" data-a="doban" data-n="${t.dataset.n}">Confirm ban</button><button class="btn g" data-a="close">Cancel</button>`),
      doban: t => {
        modal('');
        toast(`User ${t.dataset.n} banned`);
      },
      audit: t => modal(`<h3>Audit log · ${t.dataset.n}</h3><div class="mu" style="font-size:13px;line-height:1.8">08 Nov 10:12 · Authenticated via OTP<br>07 Nov 21:40 · Completed Voice Match (6m)<br>06 Nov 18:05 · Purchased Gold Ticket #HD-1042<br>04 Nov 09:30 · Profile verified</div><button class="btn g" style="margin-top:8px" data-a="close">Close</button>`)
    };

    function bookUI() {
      const e = EV[ui.ev], p = e[4][ui.tier];
      modal(`<h3>${e[0]}</h3><div class="mu" style="font-size:13px">${e[1]} · ${e[2]}</div><div style="display:grid;gap:8px;margin:8px 0">${TIERS.map((n, i) => `<div class="sel ${i === ui.tier ? 'on' : ''}" data-a="tier" data-i="${i}"><div class="row sp"><b>${n}</b><span>${e[4][i] ? '₹' + e[4][i] : 'Free'}</span></div></div>`).join('')}</div><div class="row sp"><span>Number of Seats</span><div class="row"><button class="btn g s" data-a="seat" data-d="-1">−</button><b>${ui.seats}</b><button class="btn g s" data-a="seat" data-d="1">+</button></div></div><button class="btn" data-a="pay">Confirm · ₹${p * ui.seats}</button><button class="btn g" data-a="close">Cancel</button>`);
    }

    document.addEventListener('click', e => {
      const t = e.target.closest('[data-a]');
      if (t && !['uq', 'uf'].includes(t.dataset.a)) {
        A[t.dataset.a]?.(t, e);
      } else if (e.target.hasAttribute('data-bg')) {
        modal('');
      }
      if (!e.target.closest('#dd')) $('#dd')?.classList.remove('open');
    });

    document.addEventListener('input', e => {
      if (e.target.id === 'uq') {
        ui.q = e.target.value;
        const p = e.target.selectionStart;
        route();
        const n = $('#uq');
        if (n) { n.focus(); n.setSelectionRange(p, p); }
      }
    });

    document.addEventListener('change', e => {
      if (e.target.id === 'uf') {
        ui.f = e.target.value;
        route();
      }
    });

    // Cross-tab real-time sync
    function handleIncomingSync() {
      const cur = CallBroker.getPendingCall();
      const outgoing = $('#outgoingCallScreen');
      if (outgoing) {
        if (cur && cur.status === 'accepted') {
          clearInterval(callPollTimer);
          SoundFX.stopRinging();
          outgoing.remove();
          toast(`${cur.celebName || 'Creator'} accepted the call! Connecting 🎉`);
          callUI(cur.celebName || 'Creator', cur.mode || 'Video');
        } else if (cur && cur.status === 'declined') {
          clearInterval(callPollTimer);
          SoundFX.stopRinging();
          outgoing.remove();
          toast(`${cur.celebName || 'Creator'} declined the call`);
        } else if (!cur || cur.status === 'cancelled') {
          clearInterval(callPollTimer);
          SoundFX.stopRinging();
          outgoing.remove();
        }
      }

      const activeCallStage = $('#call');
      if (activeCallStage && cur && (cur.status === 'ended' || cur.status === 'cancelled' || cur.status === 'declined')) {
        clearInterval(tm);
        stopCamera();
        SoundFX.stopRinging();
        activeCallStage.remove();
        toast('Call ended by peer');
      }

      checkIncomingCallForCelebrity();
      if (location.hash.includes('celebrity-queue')) route();
      if (location.hash === '#app-vip' || location.hash === '#celebrity-studio') route();
    }

    if (CALL_CHANNEL) {
      CALL_CHANNEL.onmessage = e => {
        if (e.data && e.data.type === 'CALL_DECLINED') {
          const outgoing = $('#outgoingCallScreen');
          if (outgoing) {
            clearInterval(callPollTimer);
            SoundFX.stopRinging();
            outgoing.remove();
            toast(`${e.data.celebName || 'Creator'} declined the call`);
          }
        }
        handleIncomingSync();
      };
    }
    window.addEventListener('storage', e => {
      if (e.key === 'vibzz_sync_time' || e.key === 'vibzz_pending_call' || e.key === 'vibzz_custom_creators' || e.key === 'huddle') {
        handleIncomingSync();
      }
    });

    // Background poller for incoming calls on celebrity screen
    setInterval(handleIncomingSync, 800);

    route();
  </script>
</body>
</html>
